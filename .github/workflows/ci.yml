name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime

  bun:
    name: Portable core (Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build
      - name: Import and exercise the portable package entry point
        run: >-
          bun --eval 'import { MESSAGE_PART_TYPES, generationEventCursor, skillInline }
          from "@viby/sdk/core";
          if (!MESSAGE_PART_TYPES.includes("tool-call")) throw new Error("missing message parts");
          if (generationEventCursor(new Headers({"Last-Event-ID":"9"})) !== "9") throw new Error("invalid cursor");
          if (skillInline({name:"rules",files:[{path:"SKILL.md",content:"# Rules"}]}).source !== "inline") throw new Error("invalid skill");'
      - run: bun run scripts/runtime-bun.ts
      - run: bun build dist/core.js --target=browser --outdir=/tmp/viby-portable-core

  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/check-release-version.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:compatibility
      - run: npm run test:runtime
      - run: npm ci --prefix examples/reference
      - run: npm run typecheck --prefix examples/reference
      - run: npm run test:reference
      - run: npm run test:package
      - run: npm pack --dry-run --ignore-scripts
      - run: npm ci --prefix examples/basic
      - run: npm run typecheck --prefix examples/basic

  docs:
    name: Farm documentation website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm run docs:typecheck
      - run: npm run docs:build

  quality:
    name: Generated project quality matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:quality

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: viby_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d viby_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viby_test
      SCHEMA_UPGRADE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/viby_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run test:schema-upgrade
      - run: npm run build
      - run: node dist/cli.js db status
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

  docker:
    name: Docker sandbox integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:docker

  playwright:
    name: Playwright browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:playwright
